# Application Configuration
app.name=Trip Platform
app.version=1.0.0
app.developer=Nurmuhammad

# View Configuration
view=console

# Controller Configuration
controller=simple

# Service Configuration
service=simple

# DAO Configuration
dao=straight

# Data Source Configuration
source=csv
source.user=src/main/resources/data/users.csv
source.flight=src/main/resources/data/flights.csv
source.hotel=src/main/resources/data/hotels.csv
source.car=src/main/resources/data/cars.csv
source.place=src/main/resources/data/places.csv
source.tour=src/main/resources/data/tours.csv
source.taxi=src/main/resources/data/taxis.csv
source.booking=src/main/resources/data/bookings.csv

# API Integration Configuration
# Set to true to enable live API data, false to use CSV only
api.enabled=true

# Aviationstack API (Flight Data)
api.aviationstack.enabled=true
api.aviationstack.key=b25e81fd169e95734032fb6f6651b55c
api.aviationstack.url=http://api.aviationstack.com/v1

# OpenRouteService API (Places/Tourism Data)
api.openrouteservice.enabled=true
api.openrouteservice.key=eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImVmOWZhMjc3YzE5ZjQwMTFhMTc0OTE3YmI0ODQ4M2M0IiwiaCI6Im11cm11cjY0In0=
api.openrouteservice.url=https://api.openrouteservice.org

# API Settings
api.timeout.seconds=30
api.retry.count=2
api.cache.enabled=true
api.cache.duration.minutes=60